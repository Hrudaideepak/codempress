<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Codempress — AI Engineering Studio</title>
    <link rel="icon" type="image/png" href="/brand/favicons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/ios_app_icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#7C3AED" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      // Automatic stale asset cache invalidation guard
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (
          event.reason.message?.includes('is not a function') ||
          event.reason.name === 'ChunkLoadError' ||
          event.reason.message?.includes('Loading chunk')
        )) {
          console.warn('[CacheGuard] Outdated client bundle detected. Purging cache and reloading fresh asset bundle...');
          if (!sessionStorage.getItem('sf_reloaded_for_cache')) {
            sessionStorage.setItem('sf_reloaded_for_cache', 'true');
            window.location.reload(true);
          }
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
