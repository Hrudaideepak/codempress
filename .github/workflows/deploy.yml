name: Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Execute Backend Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Project Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx pytest-asyncio anyio

      - name: Seed Database Skeleton
        run: python content/seed_topics.py

      - name: Run E2E Test Suite
        env:
          PYTHONPATH: .
        run: python -m pytest -k "not test_frontend_rendering"

  build-containers:
    name: Build & Verify Containers compilation
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Backend Container
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false

      - name: Build Frontend Container
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false

  build-android-apk:
    name: Build Android APK Package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Web Bundle & Sync Capacitor Android
        run: |
          cd frontend
          npm install
          npm run build
          npx @capacitor/cli sync android

      - name: Build Android APK with Gradle
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: codempress-android-app
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

  deploy-render:
    name: Deploy Backend to Render
    needs: [test, build-containers]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Trigger Render Deployment Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render deploy..."
            curl -X POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not set, skipping automatic Render webhook trigger."
          fi

  deploy-vercel:
    name: Deploy Frontend to Vercel
    needs: [test, build-containers]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./frontend

  verify-deployment:
    name: Verify Production Deployment
    needs: [deploy-render, deploy-vercel]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Wait for services to stabilize & Verify Deployment
        run: |
          echo "Waiting 30 seconds for Render and Vercel rollouts..."
          sleep 30
          python scripts/verify_deployment.py --backend https://codempress-backend.onrender.com --frontend https://codempress.vercel.app || true

